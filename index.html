<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Under Construction</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#241b64;
    --blue:#5468e0;
    --blue-light:#7c8bea;
    --lavender:#e8e9fb;
    --yellow:#f5c344;
    --gray:#6b7280;
    --white:#ffffff;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Poppins', sans-serif;
    background:var(--white);
    color:var(--navy);
    min-height:100vh;
    display:flex;
    align-items:center;
    overflow-x:hidden;
  }

  .wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    max-width:1200px;
    margin:0 auto;
    padding:40px 24px;
    gap:40px;
    width:100%;
  }

  .left h1{
    font-size:clamp(2.4rem, 5vw, 3.6rem);
    font-weight:800;
    line-height:1;
    letter-spacing:-1px;
    color:var(--navy);
  }

  .left h2{
    font-size:clamp(1.1rem, 2vw, 1.5rem);
    font-weight:600;
    color:var(--navy);
    margin-top:6px;
    margin-bottom:24px;
  }

  .left p{
    color:var(--gray);
    font-size:1rem;
    line-height:1.6;
    margin-bottom:4px;
  }

  .countdown{
    display:grid;
    grid-template-columns:repeat(4, auto);
    gap:28px;
    margin:36px 0 28px;
  }

  .countdown .sep{
    font-size:2rem;
    font-weight:700;
    color:var(--navy);
    align-self:flex-start;
    padding-top:2px;
  }

  .cd-unit .num{
    font-size:clamp(1.8rem, 4vw, 2.4rem);
    font-weight:800;
    color:var(--navy);
    font-variant-numeric:tabular-nums;
  }

  .cd-unit .label{
    font-size:0.7rem;
    letter-spacing:1.5px;
    color:var(--gray);
    font-weight:600;
    margin-top:2px;
  }

  .cd-row{
    display:flex;
    align-items:flex-start;
    gap:24px;
    flex-wrap:wrap;
  }

  .cd-row .colon{
    font-size:1.6rem;
    font-weight:700;
    color:var(--navy);
    padding-top:2px;
  }

  .socials{
    display:flex;
    gap:12px;
  }

  .socials a{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    transition:transform .2s ease, opacity .2s ease;
  }
  .socials a:hover{ transform:translateY(-3px); opacity:.9; }

  .fb{background:#3b5998;}
  .tw{background:#4fb6e8;}
  .ig{background:#e1306c;}
  .li{background:#0077b5;}
  .yt{background:#ff0000;}

  .right{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .blob{
    position:absolute;
    width:100%;
    max-width:560px;
    z-index:0;
  }

  .illus{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
  }

  @media (max-width: 860px){
    .wrap{ grid-template-columns:1fr; text-align:left; }
    .right{ order:-1; margin-bottom:8px; }
  }

  @media (prefers-reduced-motion: no-preference){
    .worker-walk{ animation: walk 3.2s ease-in-out infinite; }
    @keyframes walk{
      0%,100%{ transform:translateX(0); }
      50%{ transform:translateX(14px); }
    }
    .hook{ animation: sway 2.6s ease-in-out infinite; transform-origin: 300px 40px; }
    @keyframes sway{
      0%,100%{ transform:rotate(-2deg); }
      50%{ transform:rotate(2deg); }
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="left">
    <h1>WEBSITE</h1>
    <h2>UNDER CONSTRUCTION</h2>
    <p>We're currently working on creating something fantastic.</p>
    <p>We'll be here soon, subscribe to be notified.</p>

    <div class="countdown">
      <div class="cd-row" id="countdown">
        <div class="cd-unit">
          <div class="num" id="days">00</div>
          <div class="label">DAYS</div>
        </div>
        <div class="colon">:</div>
        <div class="cd-unit">
          <div class="num" id="hours">00</div>
          <div class="label">HOURS</div>
        </div>
        <div class="colon">:</div>
        <div class="cd-unit">
          <div class="num" id="minutes">00</div>
          <div class="label">MINUTES</div>
        </div>
        <div class="colon">:</div>
        <div class="cd-unit">
          <div class="num" id="seconds">00</div>
          <div class="label">SECONDS</div>
        </div>
      </div>
    </div>

    <div class="socials">
      <a class="fb" href="#" aria-label="Facebook">f</a>
      <a class="tw" href="#" aria-label="Twitter">t</a>
      <a class="ig" href="#" aria-label="Instagram">ig</a>
      <a class="li" href="#" aria-label="LinkedIn">in</a>
      <a class="yt" href="#" aria-label="YouTube">▶</a>
    </div>
  </div>

  <div class="right">
    <svg class="blob" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
      <path fill="#eceefb" d="M78,120 C140,40 260,10 360,30 C470,52 560,110 570,210 C580,320 500,400 400,440 C300,480 160,470 90,400 C20,330 10,210 78,120 Z"/>
    </svg>

    <svg class="illus" viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg">
      <!-- city skyline silhouette -->
      <g opacity="0.15" fill="#8a93d6">
        <rect x="20" y="300" width="30" height="140"/>
        <rect x="60" y="260" width="26" height="180"/>
        <rect x="460" y="280" width="28" height="160"/>
        <rect x="495" y="240" width="24" height="200"/>
      </g>

      <!-- tree -->
      <circle cx="70" cy="360" r="42" fill="#5468e0"/>
      <rect x="63" y="395" width="14" height="55" fill="#8a93d6"/>

      <!-- crane -->
      <g stroke="#5468e0" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="455" y1="460" x2="455" y2="60"/>
        <line x1="455" y1="60" x2="330" y2="120"/>
        <line x1="330" y1="120" x2="455" y2="60"/>
        <polyline points="440,80 455,60 440,100"/>
        <polyline points="410,95 455,60 420,115"/>
        <polyline points="390,105 455,60 400,130"/>
        <polyline points="365,112 455,60 375,138"/>
        <polyline points="340,118 455,60 350,145"/>
      </g>
      <rect x="435" y="55" width="45" height="30" rx="4" fill="#2d3a99"/>
      <circle cx="457" cy="70" r="6" fill="#f5c344"/>

      <!-- hook + warning sign -->
      <g class="hook">
        <line x1="330" y1="125" x2="330" y2="185" stroke="#241b64" stroke-width="4"/>
        <circle cx="330" cy="195" r="12" fill="#241b64"/>
        <line x1="330" y1="207" x2="330" y2="230" stroke="#241b64" stroke-width="4"/>
        <g transform="translate(280,230) rotate(-8)">
          <rect x="0" y="0" width="100" height="100" rx="14" fill="#f5c344" transform="rotate(45 50 50)"/>
          <text x="50" y="66" font-size="46" font-weight="800" text-anchor="middle" fill="#241b64" font-family="Poppins, sans-serif">!</text>
        </g>
      </g>

      <!-- laptop body -->
      <rect x="140" y="220" width="300" height="200" rx="18" fill="#5468e0"/>
      <rect x="160" y="240" width="260" height="160" rx="8" fill="#3446b8"/>
      <rect x="120" y="410" width="340" height="18" rx="9" fill="#3d4fc4"/>

      <!-- caution stripe across laptop -->
      <g>
        <rect x="130" y="330" width="320" height="34" fill="#f5c344"/>
        <g fill="#241b64">
          <polygon points="150,330 170,330 150,364 130,364"/>
          <polygon points="200,330 220,330 200,364 180,364"/>
          <polygon points="250,330 270,330 250,364 230,364"/>
          <polygon points="300,330 320,330 300,364 280,364"/>
          <polygon points="350,330 370,330 350,364 330,364"/>
          <polygon points="400,330 420,330 400,364 380,364"/>
        </g>
      </g>

      <!-- traffic cones -->
      <g fill="#f5c344" stroke="#241b64" stroke-width="2">
        <polygon points="150,410 165,455 135,455"/>
        <rect x="128" y="453" width="44" height="10" fill="#241b64" stroke="none"/>
        <polygon points="430,410 445,455 415,455"/>
        <rect x="408" y="453" width="44" height="10" fill="#241b64" stroke="none"/>
      </g>

      <!-- seated worker on laptop with a small computer -->
      <g transform="translate(150,150)">
        <circle cx="40" cy="20" r="18" fill="#ffb98a"/>
        <path d="M22,14 a18,16 0 0,1 36,0 z" fill="#f5c344"/>
        <rect x="15" y="38" width="50" height="55" rx="12" fill="#e8e9fb"/>
        <rect x="20" y="70" width="40" height="45" fill="#241b64"/>
        <rect x="0" y="60" width="30" height="20" rx="4" fill="#241b64"/>
      </g>

      <!-- walking worker with megaphone -->
      <g class="worker-walk" transform="translate(300,300)">
        <circle cx="60" cy="20" r="16" fill="#ffb98a"/>
        <path d="M44,15 a16,14 0 0,1 32,0 z" fill="#f5c344"/>
        <rect x="45" y="34" width="32" height="50" rx="10" fill="#e8e9fb"/>
        <rect x="48" y="82" width="10" height="45" fill="#241b64"/>
        <rect x="66" y="82" width="10" height="45" fill="#241b64"/>
        <rect x="20" y="42" width="26" height="12" rx="5" fill="#ffb98a"/>
        <circle cx="18" cy="48" r="8" fill="#f5c344"/>
      </g>
    </svg>
  </div>
</div>

<script>
  // Set your target date here (YYYY-MM-DDTHH:mm:ss)
  const target = new Date();
  target.setDate(target.getDate() + 12);
  target.setHours(target.getHours());
  target.setMinutes(target.getMinutes() + 1);

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = new Date();
    let diff = Math.max(0, target - now);

    const days = Math.floor(diff / (1000*60*60*24));
    diff -= days * (1000*60*60*24);
    const hours = Math.floor(diff / (1000*60*60));
    diff -= hours * (1000*60*60);
    const minutes = Math.floor(diff / (1000*60));
    diff -= minutes * (1000*60);
    const seconds = Math.floor(diff / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
