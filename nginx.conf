server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    error_page 503 @maintenance;

    location @maintenance {
        rewrite ^(.*)$ /index.html break;
    }

    location / {
        return 503;
    }

    # let health checks / load balancers through
    location = /healthz {
        return 200 'maintenance';
        add_header Content-Type text/plain;
    }
}
